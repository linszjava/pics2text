name: pics2text

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pics2text}
      POSTGRES_USER: ${POSTGRES_USER:-pics2text}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pics2text_dev}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pics2text}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pics2text_dev}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit default_queue_type quorum"
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  object-storage:
    image: chrislusf/seaweedfs:4.47
    command: ["server", "-s3", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-pics2text}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-pics2text_dev_secret}
      S3_BUCKET: ${S3_BUCKET:-pics2text}
    ports:
      - "${S3_PORT:-19000}:8333"
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://object-storage:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  render-worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: mosaic-render-worker/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pics2text}
      DB_USERNAME: ${POSTGRES_USER:-pics2text}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pics2text_dev}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-pics2text}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pics2text_dev}
      S3_ENDPOINT: http://object-storage:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-pics2text}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-pics2text_dev_secret}
      S3_BUCKET: ${S3_BUCKET:-pics2text}
      PRINT_RENDER_TEMP_ROOT: /var/tmp/pics2text-render
      PRINT_RENDER_PYTHON: /usr/bin/python3
      PRINT_RENDER_SCRIPT: /opt/pics2text/render_print.py
      PRINT_RENDER_SRGB_PROFILE: /usr/share/color/icc/sRGB.icc
      PRINT_RENDER_MAX_SOURCE_BYTES: ${PRINT_RENDER_MAX_SOURCE_BYTES:-1073741824}
      PRINT_RENDER_MAX_OUTPUT_BYTES: ${PRINT_RENDER_MAX_OUTPUT_BYTES:-1099511627776}
      PRINT_RENDER_NATIVE_MEMORY_BYTES: ${PRINT_RENDER_NATIVE_MEMORY_BYTES:-536870912}
      PRINT_RENDER_MAX_OPEN_FILES: ${PRINT_RENDER_MAX_OPEN_FILES:-256}
      PRINT_RENDER_TIMEOUT: ${PRINT_RENDER_TIMEOUT:-6h}
      PRINT_RENDER_STALE_TEMP_AGE: ${PRINT_RENDER_STALE_TEMP_AGE:-24h}
      PRINT_RENDER_CLEANUP_INTERVAL: ${PRINT_RENDER_CLEANUP_INTERVAL:-1h}
      TMPDIR: /var/tmp/pics2text-render
      JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=/var/tmp/pics2text-render
    ports:
      - "${RENDER_WORKER_PORT:-18082}:18082"
    volumes:
      - render-worker-temp:/var/tmp/pics2text-render
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    read_only: true
    mem_limit: ${RENDER_WORKER_MEMORY_LIMIT:-2g}
    pids_limit: 256
    ulimits:
      nofile:
        soft: 512
        hard: 512
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  object-storage-data:
  render-worker-temp:
