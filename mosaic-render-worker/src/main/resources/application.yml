server:
  port: ${SERVER_PORT:18082}
  shutdown: graceful

spring:
  application:
    name: mosaic-render-worker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/pics2text}
    username: ${DB_USERNAME:pics2text}
    password: ${DB_PASSWORD:pics2text_dev}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:pics2text}
    password: ${RABBITMQ_PASSWORD:pics2text_dev}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: ${JOB_WORKER_PREFETCH:2}

jobs:
  worker:
    enabled: true
    queue: mosaic.jobs.render.q
    consumer-name: mosaic-render-worker
    id: ${JOB_WORKER_ID:${spring.application.name}}
  retry:
    base-delay: ${JOB_RETRY_BASE_DELAY:5s}
    max-delay: ${JOB_RETRY_MAX_DELAY:5m}

object-storage:
  endpoint: ${S3_ENDPOINT:http://localhost:19000}
  region: ${S3_REGION:us-east-1}
  access-key: ${S3_ACCESS_KEY:pics2text}
  secret-key: ${S3_SECRET_KEY:pics2text_dev_secret}
  bucket: ${S3_BUCKET:pics2text}

print-render:
  temp-root: ${PRINT_RENDER_TEMP_ROOT:${java.io.tmpdir}/pics2text-render}
  python-executable: ${PRINT_RENDER_PYTHON:/usr/bin/python3}
  renderer-script: ${PRINT_RENDER_SCRIPT:mosaic-render-worker/src/main/python/render_print.py}
  srgb-profile: ${PRINT_RENDER_SRGB_PROFILE:/usr/share/color/icc/colord/sRGB.icc}
  max-source-bytes: ${PRINT_RENDER_MAX_SOURCE_BYTES:1073741824}
  max-output-bytes: ${PRINT_RENDER_MAX_OUTPUT_BYTES:1099511627776}
  native-memory-bytes: ${PRINT_RENDER_NATIVE_MEMORY_BYTES:536870912}
  max-open-files: ${PRINT_RENDER_MAX_OPEN_FILES:256}
  timeout: ${PRINT_RENDER_TIMEOUT:6h}
  stale-temp-age: ${PRINT_RENDER_STALE_TEMP_AGE:24h}
  cleanup-interval: ${PRINT_RENDER_CLEANUP_INTERVAL:1h}

mybatis-plus:
  type-handlers-package: com.pics2text.job.infrastructure.persistence
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
