global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: mosaic-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:18080]

  - job_name: mosaic-analysis-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:18081]

  - job_name: mosaic-render-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:18082]

  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]

  - job_name: object-storage
    static_configs:
      - targets: [object-storage:9327]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
