server:
  port: ${SERVER_PORT:18080}
  shutdown: graceful

spring:
  application:
    name: mosaic-api
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/pics2text}
    username: ${DB_USERNAME:pics2text}
    password: ${DB_PASSWORD:pics2text_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:pics2text}
    password: ${RABBITMQ_PASSWORD:pics2text_dev}
    publisher-confirm-type: correlated
    publisher-returns: true
  flyway:
    enabled: true
    validate-migration-naming: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-handlers-package: com.pics2text.job.infrastructure.persistence
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 2592000
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  max-login-count: 5
  token-style: uuid

identity:
  bootstrap-token: ${IDENTITY_BOOTSTRAP_TOKEN:pics2text-bootstrap-dev}
  registration-enabled: ${IDENTITY_REGISTRATION_ENABLED:true}
  login:
    maximum-attempts: ${LOGIN_MAXIMUM_ATTEMPTS:5}
    lock-duration: ${LOGIN_LOCK_DURATION:15m}

object-storage:
  endpoint: ${S3_ENDPOINT:http://localhost:19000}
  public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:19000}
  region: ${S3_REGION:us-east-1}
  access-key: ${S3_ACCESS_KEY:pics2text}
  secret-key: ${S3_SECRET_KEY:pics2text_dev_secret}
  bucket: ${S3_BUCKET:pics2text}
  presign-duration: ${S3_PRESIGN_DURATION:15m}
  upload-ttl: ${S3_UPLOAD_TTL:24h}
  multipart-threshold: ${S3_MULTIPART_THRESHOLD:10485760}
  multipart-part-size: ${S3_MULTIPART_PART_SIZE:8388608}
  verification-buffer-size: ${PHOTO_VERIFICATION_BUFFER_SIZE:2097152}
  cleanup-interval: ${PHOTO_CLEANUP_INTERVAL:1h}

jobs:
  analysis-dispatch:
    enabled: ${JOB_ANALYSIS_DISPATCH_ENABLED:true}
    interval: ${JOB_ANALYSIS_DISPATCH_INTERVAL:30s}
  publisher:
    enabled: true
    interval: ${JOB_OUTBOX_INTERVAL:1000}
    batch-size: ${JOB_OUTBOX_BATCH_SIZE:50}
    claim-timeout: ${JOB_OUTBOX_CLAIM_TIMEOUT:1m}
    confirm-timeout: ${JOB_PUBLISH_CONFIRM_TIMEOUT:10s}
    max-attempts: ${JOB_PUBLISH_MAX_ATTEMPTS:10}
  recovery:
    enabled: true
    interval: ${JOB_RECOVERY_INTERVAL:30000}
    heartbeat-timeout: ${JOB_HEARTBEAT_TIMEOUT:2m}
    batch-size: ${JOB_RECOVERY_BATCH_SIZE:50}
  retry:
    base-delay: ${JOB_RETRY_BASE_DELAY:5s}
    max-delay: ${JOB_RETRY_MAX_DELAY:5m}
  sse:
    poll-interval: ${JOB_SSE_POLL_INTERVAL:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

logging:
  structured:
    format:
      console: logstash
