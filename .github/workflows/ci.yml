name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress verify
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mosaic-web
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mosaic-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Install Chrome for Playwright
        run: npx playwright install --with-deps chrome
      - name: End-to-end test
        run: npm run test:e2e
      - name: Build
        run: npm run build
