openapi: 3.1.0
info:
  title: Pics2Text API
  version: 0.1.0
  description: Pics2Text 身份认证、项目管理、照片直传与异步作业 API。
servers:
  - url: http://localhost:18080
    description: 本地开发环境
tags:
  - name: Authentication
  - name: Users
  - name: Projects
  - name: Photos
  - name: Jobs
  - name: Audit
paths:
  /api/v1/auth/bootstrap:
    post:
      tags: [Authentication]
      summary: 首次创建系统管理员
      description: 只允许成功调用一次。部署环境必须通过 IDENTITY_BOOTSTRAP_TOKEN 设置高强度初始化凭据。
      parameters:
        - in: header
          name: X-Bootstrap-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BootstrapRequest' }
      responses:
        '201':
          description: 管理员创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: 登录
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: 登录失败次数过多
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: 退出当前会话
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: 已退出 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: 续期当前会话
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 续期成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: 获取当前用户
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/admin/users:
    get:
      tags: [Users]
      summary: 查询用户
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 用户列表，最多返回 200 条
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      summary: 创建用户
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: 用户创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/users/{userId}/status:
    patch:
      tags: [Users]
      summary: 启用或停用用户
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/UserStatus' }
      responses:
        '200':
          description: 状态更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin/users/{userId}/kick:
    post:
      tags: [Users]
      summary: 强制用户全部会话下线
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204': { description: 已踢出 }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/projects:
    get:
      tags: [Projects]
      summary: 查询当前用户可见项目
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 项目列表
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Project' } }
    post:
      tags: [Projects]
      summary: 创建项目权限载体
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201':
          description: 项目创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/projects/{projectId}:
    get:
      tags: [Projects]
      summary: 查询有权访问的项目
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 项目信息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Projects]
      summary: 修改项目配置
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProjectRequest' }
      responses:
        '200': { description: 修改成功, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/projects/{projectId}/archive:
    post:
      tags: [Projects]
      summary: 归档项目
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200': { description: 已归档, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
  /api/v1/projects/{projectId}/activate:
    post:
      tags: [Projects]
      summary: 恢复项目
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200': { description: 已恢复, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
  /api/v1/projects/{projectId}/members:
    get:
      tags: [Projects]
      summary: 查询项目成员
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 项目成员列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProjectMember' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/projects/{projectId}/members/{userId}:
    put:
      tags: [Projects]
      summary: 新增成员或修改项目角色
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/ProjectRole' }
      responses:
        '200':
          description: 成员保存成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMember' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Projects]
      summary: 移除项目成员
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204': { description: 已移除 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/projects/{projectId}/photos/uploads:
    post:
      tags: [Photos]
      summary: 创建照片直传会话
      description: 小文件返回 PUT URL；大文件返回分片参数，文件内容不经 API 转发。
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InitiateUploadRequest' }
      responses:
        '201': { description: 上传会话或重复照片, content: { application/json: { schema: { $ref: '#/components/schemas/InitiatedUpload' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/projects/{projectId}/photos/{photoId}/uploads/parts/{partNumber}/presign:
    post:
      tags: [Photos]
      summary: 获取指定分片的上传 URL
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/PhotoId' }
        - { in: path, name: partNumber, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: 预签名请求, content: { application/json: { schema: { $ref: '#/components/schemas/PresignedRequest' } } } }
  /api/v1/projects/{projectId}/photos/{photoId}/uploads/complete:
    post:
      tags: [Photos]
      summary: 完成上传并验真
      description: 校验对象大小、实际 SHA-256、魔数、格式和分辨率；失败对象不会进入 AVAILABLE。
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/PhotoId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteUploadRequest' }
      responses:
        '200': { description: 验真结果, content: { application/json: { schema: { $ref: '#/components/schemas/Photo' } } } }
        '422': { description: 文件验真失败, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/projects/{projectId}/photos/{photoId}/uploads/progress:
    get:
      tags: [Photos]
      summary: 查询上传进度和失败原因
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/PhotoId' }]
      responses:
        '200': { description: 上传进度, content: { application/json: { schema: { $ref: '#/components/schemas/UploadProgress' } } } }
  /api/v1/projects/{projectId}/photos/{photoId}/uploads:
    delete:
      tags: [Photos]
      summary: 取消上传并清理对象
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/PhotoId' }]
      responses:
        '204': { description: 已取消 }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/projects/{projectId}/photos:
    get:
      tags: [Photos]
      summary: 分页查询照片
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: 照片列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Photo' } } } } }
  /api/v1/projects/{projectId}/photos/{photoId}:
    get:
      tags: [Photos]
      summary: 查询照片元数据
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/PhotoId' }]
      responses:
        '200': { description: 照片, content: { application/json: { schema: { $ref: '#/components/schemas/Photo' } } } }
    delete:
      tags: [Photos]
      summary: 管理员删除照片及对象
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/PhotoId' }]
      responses: { '204': { description: 已删除 }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/projects/{projectId}/photos/{photoId}/download-url:
    post:
      tags: [Photos]
      summary: 获取私有原图下载 URL
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/PhotoId' }]
      responses:
        '200': { description: 预签名下载请求, content: { application/json: { schema: { $ref: '#/components/schemas/PresignedRequest' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/projects/{projectId}/photos/{photoId}/withdraw:
    post:
      tags: [Photos]
      summary: 撤回照片并进入保留期
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/PhotoId' }]
      responses:
        '200': { description: 已撤回, content: { application/json: { schema: { $ref: '#/components/schemas/Photo' } } } }
  /api/v1/projects/{projectId}/jobs:
    get:
      tags: [Jobs]
      summary: 分页查询项目作业
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: 作业列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Job' } } } } }
  /api/v1/projects/{projectId}/jobs/{jobId}:
    get:
      tags: [Jobs]
      summary: 查询作业详情
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/JobId' }]
      responses:
        '200': { description: 作业详情, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/projects/{projectId}/jobs/{jobId}/cancel:
    post:
      tags: [Jobs]
      summary: 请求取消作业
      description: 等待或重试中的作业立即取消；运行中的作业在下一个安全检查点取消；不可取消阶段返回冲突。
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/JobId' }]
      responses:
        '200': { description: 取消请求已接受, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/projects/{projectId}/jobs/{jobId}/retry:
    post:
      tags: [Jobs]
      summary: 人工重新执行终态作业
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/JobId' }]
      responses:
        '200': { description: 已重新排队, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/projects/{projectId}/jobs/events:
    get:
      tags: [Jobs]
      summary: 订阅项目作业进度
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200':
          description: connected 与 job-updated 事件流
          content:
            text/event-stream:
              schema: { type: string }
  /api/v1/projects/{projectId}/jobs/probes:
    post:
      tags: [Jobs]
      summary: 创建基础设施验收探针作业
      description: 仅用于运维验收和故障演练，需要项目管理权限。
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProbeJobRequest' }
      responses:
        '201': { description: 探针已创建, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
  /api/v1/admin/audit-logs:
    get:
      tags: [Audit]
      summary: 查询最近审计记录
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 最近 200 条审计记录，不返回 IP 和内部详情
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditLog' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    UserId:
      in: path
      name: userId
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      in: path
      name: projectId
      required: true
      schema: { type: string, format: uuid }
    PhotoId:
      in: path
      name: photoId
      required: true
      schema: { type: string, format: uuid }
    JobId:
      in: path
      name: jobId
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: 未登录、Token 失效、已退出或已被踢出
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: 功能权限或项目级权限不足
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: 数据状态冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    BootstrapRequest:
      type: object
      required: [username, password, displayName]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, format: password, minLength: 12, maxLength: 128 }
        displayName: { type: string, minLength: 1, maxLength: 100 }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string, format: password, maxLength: 128 }
    CreateUserRequest:
      type: object
      required: [username, password, displayName, globalRole]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, format: password, minLength: 12, maxLength: 128 }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        globalRole: { $ref: '#/components/schemas/GlobalRole' }
    Session:
      type: object
      required: [tokenName, tokenValue, tokenTimeout, activeTimeout, user]
      properties:
        tokenName: { type: string, example: Authorization }
        tokenValue: { type: string }
        tokenTimeout: { type: integer, format: int64 }
        activeTimeout: { type: integer, format: int64 }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, username, displayName, globalRole, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        globalRole: { $ref: '#/components/schemas/GlobalRole' }
        status: { $ref: '#/components/schemas/UserStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GlobalRole:
      type: string
      enum: [ADMIN, USER]
    UserStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    ProjectRole:
      type: string
      enum: [PROJECT_ADMIN, REVIEWER, DESIGNER, VIEWER]
    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        description: { type: string }
        configurationJson: { type: string, description: JSON 格式的项目业务配置 }
        retentionDays: { type: integer, minimum: 1, maximum: 3650 }
        maxPhotoBytes: { type: integer, format: int64 }
        archivedAt: { type: [string, 'null'], format: date-time }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UpdateProjectRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        configurationJson: { type: string, maxLength: 20000 }
        retentionDays: { type: integer, minimum: 1, maximum: 3650 }
        maxPhotoBytes: { type: integer, format: int64, minimum: 1024, maximum: 5368709120 }
    InitiateUploadRequest:
      type: object
      required: [filename, contentType, byteSize, sha256, authorizationGranted]
      properties:
        filename: { type: string, minLength: 1, maxLength: 255 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        byteSize: { type: integer, format: int64, minimum: 1 }
        sha256: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        authorizationGranted: { type: boolean }
    CompletedPart:
      type: object
      required: [partNumber, eTag]
      properties:
        partNumber: { type: integer, minimum: 1 }
        eTag: { type: string, minLength: 1 }
    CompleteUploadRequest:
      type: object
      properties:
        parts: { type: array, items: { $ref: '#/components/schemas/CompletedPart' } }
    PresignedRequest:
      type: object
      required: [url, method, headers]
      properties:
        url: { type: string, format: uri }
        method: { type: string, enum: [GET, PUT] }
        headers:
          type: object
          additionalProperties: { type: array, items: { type: string } }
    InitiatedUpload:
      type: object
      properties:
        photo: { $ref: '#/components/schemas/Photo' }
        duplicate: { type: boolean }
        directUpload: { anyOf: [{ $ref: '#/components/schemas/PresignedRequest' }, { type: 'null' }] }
        partSize: { type: [integer, 'null'], format: int64 }
        partCount: { type: integer }
        expiresAt: { type: string, format: date-time }
    UploadProgress:
      type: object
      properties:
        status: { $ref: '#/components/schemas/PhotoStatus' }
        uploadedBytes: { type: integer, format: int64 }
        totalBytes: { type: integer, format: int64 }
        uploadedParts: { type: integer }
        totalParts: { type: integer }
        failureCode: { type: [string, 'null'] }
        failureMessage: { type: [string, 'null'] }
    PhotoStatus:
      type: string
      enum: [UPLOADING, VERIFYING, AVAILABLE, DUPLICATE, FAILED, WITHDRAWN, DELETED]
    Photo:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        uploaderId: { type: string, format: uuid }
        originalFilename: { type: string }
        declaredContentType: { type: string }
        detectedContentType: { type: [string, 'null'] }
        byteSize: { type: integer, format: int64 }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        sha256: { type: string }
        authorizationStatus: { type: string, enum: [PENDING, GRANTED, REVOKED] }
        reviewStatus: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        status: { $ref: '#/components/schemas/PhotoStatus' }
        uploadMode: { type: string, enum: [SINGLE, MULTIPART] }
        duplicateOf: { type: [string, 'null'], format: uuid }
        failureCode: { type: [string, 'null'] }
        failureMessage: { type: [string, 'null'] }
        retentionUntil: { type: [string, 'null'], format: date-time }
        availableAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectMember:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        role: { $ref: '#/components/schemas/ProjectRole' }
        createdAt: { type: string, format: date-time }
    AuditLog:
      type: object
      properties:
        id: { type: integer, format: int64 }
        actorUserId: { type: [string, 'null'], format: uuid }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: [string, 'null'] }
        success: { type: boolean }
        requestId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    ProbeJobRequest:
      type: object
      required: [failUntilAttempt, durationMillis, maxAttempts]
      properties:
        failUntilAttempt: { type: integer, minimum: 0, maximum: 20 }
        durationMillis: { type: integer, format: int64, minimum: 0, maximum: 60000 }
        maxAttempts: { type: integer, minimum: 1, maximum: 20 }
    JobStatus:
      type: string
      enum: [PENDING, RUNNING, RETRY_WAIT, CANCELLATION_REQUESTED, SUCCEEDED, FAILED, DEAD_LETTERED, CANCELLED]
    Job:
      type: object
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        resourceType: { type: [string, 'null'] }
        resourceId: { type: [string, 'null'], format: uuid }
        type: { type: string, enum: [PHOTO_ANALYSIS, LAYOUT_GENERATION, PRINT_RENDER, INFRASTRUCTURE_PROBE] }
        status: { $ref: '#/components/schemas/JobStatus' }
        progress: { type: integer, minimum: 0, maximum: 100 }
        currentAttempt: { type: integer, minimum: 0 }
        maxAttempts: { type: integer, minimum: 1 }
        nextAttemptAt: { type: [string, 'null'], format: date-time }
        heartbeatAt: { type: [string, 'null'], format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        cancellationRequestedAt: { type: [string, 'null'], format: date-time }
        cancellable: { type: boolean }
        resultJson: { type: [string, 'null'] }
        errorCode: { type: [string, 'null'] }
        errorMessage: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ApiError:
      type: object
      required: [code, message, timestamp, violations]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: [string, 'null'] }
        timestamp: { type: string, format: date-time }
        violations:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
