openapi: 3.1.0
info:
  title: Pics2Text API
  version: 0.1.0
  description: Pics2Text 身份认证、项目管理、照片直传与异步作业 API。
servers:
  - url: http://localhost:18080
    description: 本地开发环境
tags:
  - name: Authentication
  - name: Projects
  - name: Photos
  - name: Layout
  - name: Surface
  - name: Rendering
  - name: Jobs
paths:
  /api/v1/auth/bootstrap:
    post:
      tags: [Authentication]
      summary: 首次创建系统管理员
      description: 只允许成功调用一次。部署环境必须通过 IDENTITY_BOOTSTRAP_TOKEN 设置高强度初始化凭据。
      parameters:
        - in: header
          name: X-Bootstrap-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BootstrapRequest' }
      responses:
        '201':
          description: 管理员创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: 登录
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: 登录失败次数过多
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: 注册普通用户
      description: 仅创建 USER 角色；可通过 IDENTITY_REGISTRATION_ENABLED 关闭公开注册。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: 退出当前会话
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: 已退出 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: 续期当前会话
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 续期成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: 获取当前用户
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/projects:
    get:
      tags: [Projects]
      summary: 查询当前用户可见项目
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 项目列表
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Project' } }
    post:
      tags: [Projects]
      summary: 创建项目权限载体
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201':
          description: 项目创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/projects/{projectId}:
    get:
      tags: [Projects]
      summary: 查询有权访问的项目
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: 项目信息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Projects]
      summary: 修改项目配置
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProjectRequest' }
      responses:
        '200': { description: 修改成功, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/projects/{projectId}/archive:
    post:
      tags: [Projects]
      summary: 归档项目
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200': { description: 已归档, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
  /api/v1/projects/{projectId}/activate:
    post:
      tags: [Projects]
      summary: 恢复项目
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200': { description: 已恢复, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }
  /api/v1/projects/{projectId}/photos/uploads:
    post:
      tags: [Photos]
      summary: 创建照片直传会话
      description: 小文件返回 PUT URL；大文件返回分片参数，文件内容不经 API 转发。
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InitiateUploadRequest' }
      responses:
        '201': { description: 上传会话或重复照片, content: { application/json: { schema: { $ref: '#/components/schemas/InitiatedUpload' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/projects/{projectId}/photos/{photoId}/uploads/parts/{partNumber}/presign:
    post:
      tags: [Photos]
      summary: 获取指定分片的上传 URL
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/PhotoId' }
        - { in: path, name: partNumber, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: 预签名请求, content: { application/json: { schema: { $ref: '#/components/schemas/PresignedRequest' } } } }
  /api/v1/projects/{projectId}/photos/{photoId}/uploads/complete:
    post:
      tags: [Photos]
      summary: 完成上传并验真
      description: 校验对象大小、实际 SHA-256、魔数、格式和分辨率；失败对象不会进入 AVAILABLE。
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/PhotoId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteUploadRequest' }
      responses:
        '200': { description: 验真结果, content: { application/json: { schema: { $ref: '#/components/schemas/Photo' } } } }
        '429':
          description: 当前 API 实例的照片验真容量已满；请求尚未认领上传状态，可按 Retry-After 重试。
          headers:
            Retry-After:
              description: 建议等待秒数
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '422': { description: 文件验真失败, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/projects/{projectId}/photos/{photoId}/uploads/progress:
    get:
      tags: [Photos]
      summary: 查询上传进度和失败原因
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/PhotoId' }]
      responses:
        '200': { description: 上传进度, content: { application/json: { schema: { $ref: '#/components/schemas/UploadProgress' } } } }
  /api/v1/projects/{projectId}/photos/{photoId}/uploads:
    delete:
      tags: [Photos]
      summary: 取消上传并清理对象
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/PhotoId' }]
      responses:
        '204': { description: 已取消 }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/projects/{projectId}/photos:
    get:
      tags: [Photos]
      summary: 分页查询照片
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: 照片列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Photo' } } } } }
  /api/v1/projects/{projectId}/photos/{photoId}:
    get:
      tags: [Photos]
      summary: 查询照片元数据
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/PhotoId' }]
      responses:
        '200': { description: 照片, content: { application/json: { schema: { $ref: '#/components/schemas/Photo' } } } }
    patch:
      tags: [Photos]
      summary: 重命名照片（仅项目创建者）
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/PhotoId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename]
              properties:
                filename: { type: string, minLength: 1, maxLength: 255 }
      responses:
        '200': { description: 更新后的照片, content: { application/json: { schema: { $ref: '#/components/schemas/Photo' } } } }
    delete:
      tags: [Photos]
      summary: 项目创建者删除照片及对象
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/PhotoId' }]
      responses: { '204': { description: 已删除 }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/v1/projects/{projectId}/photos/{photoId}/download-url:
    post:
      tags: [Photos]
      summary: 获取私有原图下载 URL
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/PhotoId' }]
      responses:
        '200': { description: 预签名下载请求, content: { application/json: { schema: { $ref: '#/components/schemas/PresignedRequest' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/projects/{projectId}/photos/{photoId}/preview-urls:
    post:
      tags: [Photos]
      summary: 获取私有缩略图和审核预览 URL
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/PhotoId' }]
      responses:
        '200': { description: 缩略图和预览图预签名请求, content: { application/json: { schema: { $ref: '#/components/schemas/PhotoPreview' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/projects/{projectId}/photos/{photoId}/analysis:
    get:
      tags: [Photos]
      summary: 查询照片分析结果和衍生图
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/PhotoId' }]
      responses:
        '200': { description: 分析结果, content: { application/json: { schema: { $ref: '#/components/schemas/PhotoAnalysisResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/projects/{projectId}/photos/{photoId}/withdraw:
    post:
      tags: [Photos]
      summary: 撤回照片并进入保留期
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/PhotoId' }]
      responses:
        '200': { description: 已撤回, content: { application/json: { schema: { $ref: '#/components/schemas/Photo' } } } }
  /api/v1/layout/fonts:
    get:
      tags: [Layout]
      summary: 查询可用字体资产及许可证信息
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 字体资产列表
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/FontAsset' } }
  /api/v1/projects/{projectId}/text-masks:
    post:
      tags: [Layout]
      summary: 创建文字蒙版和网格生成任务
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTextMaskRequest' }
      responses:
        '201': { description: 蒙版配置和异步作业已创建, content: { application/json: { schema: { $ref: '#/components/schemas/CreatedTextMask' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Layout]
      summary: 分页查询项目文字蒙版
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: 蒙版列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TextMask' } } } } }
  /api/v1/projects/{projectId}/text-masks/{maskId}:
    get:
      tags: [Layout]
      summary: 查询文字蒙版配置和生成结果
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/MaskId' }]
      responses:
        '200': { description: 文字蒙版, content: { application/json: { schema: { $ref: '#/components/schemas/TextMask' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/projects/{projectId}/text-masks/{maskId}/slots:
    get:
      tags: [Layout]
      summary: 分页查询可放置照片的网格槽位
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/MaskId' }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
      responses:
        '200': { description: 网格槽位, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TextMaskSlot' } } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/projects/{projectId}/text-masks/{maskId}/preview-url:
    post:
      tags: [Layout]
      summary: 获取灰度蒙版或网格调试图的私有下载 URL
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/MaskId' }
        - { in: query, name: debug, schema: { type: boolean, default: false } }
      responses:
        '200': { description: 预签名下载请求, content: { application/json: { schema: { $ref: '#/components/schemas/PresignedRequest' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/projects/{projectId}/layouts:
    post:
      tags: [Layout]
      summary: 创建照片自动布局任务
      description: 只使用可用、分析成功、审核通过且授权有效的照片；布局配置和输入摘要不可变。
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAutoLayoutRequest' }
      responses:
        '201': { description: 自动布局配置和异步作业已创建, content: { application/json: { schema: { $ref: '#/components/schemas/CreatedAutoLayout' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Layout]
      summary: 分页查询项目自动布局
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: 自动布局列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AutoLayout' } } } } }
  /api/v1/projects/{projectId}/layouts/{layoutId}:
    get:
      tags: [Layout]
      summary: 查询自动布局配置和质量指标
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/LayoutId' }]
      responses:
        '200': { description: 自动布局, content: { application/json: { schema: { $ref: '#/components/schemas/AutoLayout' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/projects/{projectId}/layouts/{layoutId}/assignments:
    get:
      tags: [Layout]
      summary: 分页查询槽位与照片分配结果
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/LayoutId' }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
      responses:
        '200': { description: 布局分配结果, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AutoLayoutAssignment' } } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/projects/{projectId}/editable-layouts:
    post:
      tags: [Layout]
      summary: 从已完成的自动布局创建可编辑布局及初始不可变版本
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateEditableLayoutRequest' } } } }
      responses:
        '201': { description: 可编辑布局, content: { application/json: { schema: { $ref: '#/components/schemas/EditableLayout' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Layout]
      summary: 分页查询可编辑布局
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: 可编辑布局列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EditableLayout' } } } } }
  /api/v1/projects/{projectId}/editable-layouts/{editableLayoutId}:
    get:
      tags: [Layout]
      summary: 查询可编辑布局
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/EditableLayoutId' }]
      responses:
        '200': { description: 可编辑布局, content: { application/json: { schema: { $ref: '#/components/schemas/EditableLayout' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Layout]
      summary: 重命名可编辑布局
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/EditableLayoutId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RenameEditableLayoutRequest' } } } }
      responses:
        '200': { description: 更新后的可编辑布局, content: { application/json: { schema: { $ref: '#/components/schemas/EditableLayout' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Layout]
      summary: 删除未发布且未绑定曲面的可编辑布局
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/EditableLayoutId' }]
      responses:
        '204': { description: 删除成功 }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/projects/{projectId}/editable-layouts/{editableLayoutId}/assignments:
    get:
      tags: [Layout]
      summary: 按视口、槽位或照片查询当前草稿分配
      description: 画布使用 minX/minY/maxX/maxY 做视口虚拟化；最多返回 5000 项。
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { $ref: '#/components/parameters/EditableLayoutId' }
        - { in: query, name: photoId, schema: { type: string, format: uuid } }
        - { in: query, name: slotIndex, schema: { type: integer, minimum: 0 } }
        - { in: query, name: minX, schema: { type: integer } }
        - { in: query, name: minY, schema: { type: integer } }
        - { in: query, name: maxX, schema: { type: integer } }
        - { in: query, name: maxY, schema: { type: integer } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 5000, default: 2000 } }
      responses:
        '200': { description: 当前草稿分配, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EditableAssignment' } } } } }
  /api/v1/projects/{projectId}/editable-layouts/{editableLayoutId}/activate:
    put:
      tags: [Layout]
      summary: 将已锁定或已发布布局设为项目当前使用布局
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/EditableLayoutId' }]
      responses:
        '200': { description: 当前使用布局, content: { application/json: { schema: { $ref: '#/components/schemas/EditableLayout' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/projects/{projectId}/editable-layouts/{editableLayoutId}/photo-preview-urls:
    post:
      tags: [Layout]
      summary: 批量获取画布缩略图的私有预签名 URL
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/EditableLayoutId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PhotoPreviewUrlRequest' } } } }
      responses:
        '200': { description: 最多 200 个缩略图 URL, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PhotoPreviewUrl' } } } } }
  /api/v1/projects/{projectId}/editable-layouts/{editableLayoutId}/edits:
    post:
      tags: [Layout]
      summary: 批量执行交换、替换和裁剪并生成不可变快照
      description: expectedLockVersion 提供乐观锁；clientBatchId 提供幂等重放。发生并发冲突时绝不静默覆盖。
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/EditableLayoutId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LayoutEditBatchRequest' } } } }
      responses:
        '200': { description: 保存结果, content: { application/json: { schema: { $ref: '#/components/schemas/LayoutEditResponse' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/projects/{projectId}/editable-layouts/{editableLayoutId}/restore:
    post:
      tags: [Layout]
      summary: 从历史快照恢复并生成新的不可变版本
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/EditableLayoutId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LayoutRestoreRequest' } } } }
      responses:
        '200': { description: 恢复结果, content: { application/json: { schema: { $ref: '#/components/schemas/LayoutEditResponse' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/projects/{projectId}/editable-layouts/{editableLayoutId}/lock:
    post:
      tags: [Layout]
      summary: 锁定布局并生成锁定版本
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/EditableLayoutId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LayoutTransitionRequest' } } } }
      responses: { '200': { description: 锁定结果, content: { application/json: { schema: { $ref: '#/components/schemas/LayoutTransitionResponse' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/projects/{projectId}/editable-layouts/{editableLayoutId}/unlock:
    post:
      tags: [Layout]
      summary: 解锁布局
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/EditableLayoutId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LayoutTransitionRequest' } } } }
      responses: { '200': { description: 解锁后的布局, content: { application/json: { schema: { $ref: '#/components/schemas/EditableLayout' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/projects/{projectId}/editable-layouts/{editableLayoutId}/publish:
    post:
      tags: [Layout]
      summary: 发布已锁定布局并固化发布版本
      description: 当前锁定版本必须已经绑定 ACTIVE 曲面模板，并通过接缝、安全边距和禁印区域校验。
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/EditableLayoutId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LayoutTransitionRequest' } } } }
      responses: { '200': { description: 发布结果, content: { application/json: { schema: { $ref: '#/components/schemas/LayoutTransitionResponse' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/projects/{projectId}/editable-layouts/{editableLayoutId}/versions:
    get:
      tags: [Layout]
      summary: 分页查询不可变版本历史
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/EditableLayoutId' }, { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }, { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }]
      responses: { '200': { description: 版本历史, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LayoutVersion' } } } } } }
  /api/v1/projects/{projectId}/editable-layouts/{editableLayoutId}/operations:
    get:
      tags: [Layout]
      summary: 分页查询追加式编辑操作审计历史
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/EditableLayoutId' }, { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }, { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }]
      responses: { '200': { description: 操作历史, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LayoutEditOperation' } } } } } }
  /api/v1/projects/{projectId}/editable-layouts/{editableLayoutId}/previews:
    post:
      tags: [Layout]
      summary: 创建指定版本的低分辨率预览任务
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/EditableLayoutId' }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { versionId: { type: string, format: uuid } } } } } }
      responses: { '201': { description: 预览和任务, content: { application/json: { schema: { $ref: '#/components/schemas/LayoutPreviewCreated' } } } } }
  /api/v1/projects/{projectId}/editable-layouts/{editableLayoutId}/previews/{previewId}:
    get:
      tags: [Layout]
      summary: 查询低分辨率预览状态
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/EditableLayoutId' }, { $ref: '#/components/parameters/PreviewId' }]
      responses: { '200': { description: 预览状态, content: { application/json: { schema: { $ref: '#/components/schemas/LayoutPreview' } } } } }
  /api/v1/projects/{projectId}/editable-layouts/{editableLayoutId}/previews/{previewId}/download-url:
    post:
      tags: [Layout]
      summary: 获取已完成预览的私有下载 URL
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/EditableLayoutId' }, { $ref: '#/components/parameters/PreviewId' }]
      responses: { '200': { description: 预签名下载请求, content: { application/json: { schema: { $ref: '#/components/schemas/PresignedRequest' } } } }, '409': { $ref: '#/components/responses/Conflict' } }
  /api/v1/projects/{projectId}/surface-templates:
    post:
      tags: [Surface]
      summary: 创建不可变圆柱曲面模板
      description: 使用毫米单位，周长由直径计算；区域可标记禁印区、舱段、关键结构和参考信息。
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateSurfaceTemplateRequest' } } } }
      responses:
        '201': { description: 曲面模板, content: { application/json: { schema: { $ref: '#/components/schemas/SurfaceTemplateView' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Surface]
      summary: 分页查询项目曲面模板
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: 曲面模板列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SurfaceTemplateView' } } } } }
  /api/v1/projects/{projectId}/surface-templates/{templateId}:
    get:
      tags: [Surface]
      summary: 查询曲面模板、禁印区与结构标记
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/SurfaceTemplateId' }]
      responses:
        '200': { description: 曲面模板, content: { application/json: { schema: { $ref: '#/components/schemas/SurfaceTemplateView' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/projects/{projectId}/editable-layouts/{editableLayoutId}/surface-binding:
    post:
      tags: [Surface]
      summary: 将当前锁定版本映射到曲面并执行发布前校验
      description: 固化像素到毫米比例、UV/三维坐标清单和语义摘要。INVALID 结果会阻止布局发布。
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/EditableLayoutId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BindSurfaceRequest' } } } }
      responses:
        '200': { description: 校验后的曲面绑定, content: { application/json: { schema: { $ref: '#/components/schemas/SurfaceBindingView' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Surface]
      summary: 查询布局的曲面绑定与校验结果
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/EditableLayoutId' }]
      responses:
        '200': { description: 曲面绑定, content: { application/json: { schema: { $ref: '#/components/schemas/SurfaceBindingView' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/projects/{projectId}/editable-layouts/{editableLayoutId}/surface-preview-data:
    get:
      tags: [Surface]
      summary: 获取 Three.js 三维预览所需的不可变坐标清单和纹理 URL
      description: 坐标清单也是 P09 最终渲染的唯一曲面坐标来源；仅在已有 READY 低清预览时返回私有纹理 URL。
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/EditableLayoutId' }]
      responses:
        '200': { description: 三维预览数据, content: { application/json: { schema: { $ref: '#/components/schemas/SurfacePreviewData' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/projects/{projectId}/print-renders:
    post:
      tags: [Rendering]
      summary: 为已发布布局创建高清印刷渲染
      description: 固化不可变输入和瓦片空间索引并创建 PRINT_RENDER 作业；相同输入摘要会幂等返回已有任务。
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePrintRenderRequest' } } } }
      responses:
        '201': { description: 渲染及异步作业已创建, content: { application/json: { schema: { $ref: '#/components/schemas/CreatedPrintRender' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Rendering]
      summary: 分页查询印刷渲染
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: 渲染列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PrintRender' } } } } }
  /api/v1/projects/{projectId}/print-renders/{renderId}:
    get:
      tags: [Rendering]
      summary: 查询印刷渲染状态和校验摘要
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { in: path, name: renderId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 渲染详情, content: { application/json: { schema: { $ref: '#/components/schemas/PrintRender' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/projects/{projectId}/print-renders/{renderId}/decision:
    post:
      tags: [Rendering]
      summary: 审批或驳回待审批印刷成品
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { in: path, name: renderId, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PrintRenderDecisionRequest' } } } }
      responses:
        '200': { description: 审批后的渲染, content: { application/json: { schema: { $ref: '#/components/schemas/PrintRender' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/projects/{projectId}/print-renders/{renderId}/download-url:
    post:
      tags: [Rendering]
      summary: 获取审批通过成品的私有下载 URL
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { in: path, name: renderId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 预签名下载请求, content: { application/json: { schema: { $ref: '#/components/schemas/PresignedRequest' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/projects/{projectId}/jobs:
    get:
      tags: [Jobs]
      summary: 分页查询项目作业
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProjectId' }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: 作业列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Job' } } } } }
  /api/v1/projects/{projectId}/jobs/{jobId}:
    get:
      tags: [Jobs]
      summary: 查询作业详情
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/JobId' }]
      responses:
        '200': { description: 作业详情, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/projects/{projectId}/jobs/{jobId}/cancel:
    post:
      tags: [Jobs]
      summary: 请求取消作业
      description: 等待或重试中的作业立即取消；运行中的作业在下一个安全检查点取消；不可取消阶段返回冲突。
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/JobId' }]
      responses:
        '200': { description: 取消请求已接受, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/projects/{projectId}/jobs/{jobId}/retry:
    post:
      tags: [Jobs]
      summary: 人工重新执行终态作业
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/JobId' }]
      responses:
        '200': { description: 已重新排队, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/projects/{projectId}/jobs/events:
    get:
      tags: [Jobs]
      summary: 订阅项目作业进度
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        '200':
          description: connected 与 job-updated 事件流
          content:
            text/event-stream:
              schema: { type: string }
  /api/v1/projects/{projectId}/jobs/probes:
    post:
      tags: [Jobs]
      summary: 创建基础设施验收探针作业
      description: 仅用于运维验收和故障演练，需要项目管理权限。
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProbeJobRequest' }
      responses:
        '201': { description: 探针已创建, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    UserId:
      in: path
      name: userId
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      in: path
      name: projectId
      required: true
      schema: { type: string, format: uuid }
    PhotoId:
      in: path
      name: photoId
      required: true
      schema: { type: string, format: uuid }
    JobId:
      in: path
      name: jobId
      required: true
      schema: { type: string, format: uuid }
    MaskId:
      in: path
      name: maskId
      required: true
      schema: { type: string, format: uuid }
    LayoutId:
      in: path
      name: layoutId
      required: true
      schema: { type: string, format: uuid }
    EditableLayoutId:
      in: path
      name: editableLayoutId
      required: true
      schema: { type: string, format: uuid }
    PreviewId:
      in: path
      name: previewId
      required: true
      schema: { type: string, format: uuid }
    SurfaceTemplateId:
      in: path
      name: templateId
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: 未登录、Token 失效、已退出或已被踢出
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: 功能权限或项目级权限不足
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: 数据状态冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    BootstrapRequest:
      type: object
      required: [username, password, displayName]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, format: password, minLength: 5, maxLength: 128 }
        displayName: { type: string, minLength: 1, maxLength: 100 }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string, format: password, maxLength: 128 }
    RegisterRequest:
      type: object
      required: [username, password, displayName]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, format: password, minLength: 5, maxLength: 128 }
        displayName: { type: string, minLength: 1, maxLength: 100 }
    Session:
      type: object
      required: [tokenName, tokenValue, tokenTimeout, activeTimeout, user]
      properties:
        tokenName: { type: string, example: Authorization }
        tokenValue: { type: string }
        tokenTimeout: { type: integer, format: int64 }
        activeTimeout: { type: integer, format: int64 }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, username, displayName, globalRole, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        globalRole: { $ref: '#/components/schemas/GlobalRole' }
        status: { $ref: '#/components/schemas/UserStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GlobalRole:
      type: string
      enum: [ADMIN, USER]
    UserStatus:
      type: string
      enum: [ACTIVE, DISABLED]
    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        description: { type: string }
        configurationJson: { type: string, description: JSON 格式的项目业务配置 }
        retentionDays: { type: integer, minimum: 1, maximum: 3650 }
        maxPhotoBytes: { type: integer, format: int64 }
        activeLayoutId: { type: [string, 'null'], format: uuid }
        archivedAt: { type: [string, 'null'], format: date-time }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UpdateProjectRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        configurationJson: { type: string, maxLength: 20000 }
        retentionDays: { type: integer, minimum: 1, maximum: 3650 }
        maxPhotoBytes: { type: integer, format: int64, minimum: 1024, maximum: 5368709120 }
    InitiateUploadRequest:
      type: object
      required: [filename, contentType, byteSize, sha256, authorizationGranted]
      properties:
        filename: { type: string, minLength: 1, maxLength: 255 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        byteSize: { type: integer, format: int64, minimum: 1 }
        sha256: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        authorizationGranted: { type: boolean }
    CompletedPart:
      type: object
      required: [partNumber, eTag]
      properties:
        partNumber: { type: integer, minimum: 1 }
        eTag: { type: string, minLength: 1 }
    CompleteUploadRequest:
      type: object
      properties:
        parts: { type: array, items: { $ref: '#/components/schemas/CompletedPart' } }
